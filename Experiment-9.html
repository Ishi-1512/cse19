<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Product Grid</title>
<style>
body {
font-family: Arial, sans-serif;
margin: 0;
background: #f5f5f5;
padding: 20px;
}
h2 {
text-align: center;
margin-bottom: 20px;
}
/* Product grid */
.grid {
display: grid;
grid-template-columns: repeat(4, 1fr); /* 4 columns for large screens */
gap: 20px;
}
/* Product card */
.card {
background: #fff;
border-radius: 8px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
padding: 16px;
text-align: center;
}
.card img {
width: 100%;
height: 150px;
object-fit: cover;
border-radius: 6px;
margin-bottom: 10px;
}
.card h3 {
font-size: 18px;
margin: 8px 0;
}
.card p {
font-size: 14px;
color: #555;
margin: 4px 0;
}
.price {
font-weight: bold;
color: #007bff;
}
/* Responsive Breakpoints */
@media (max-width: 1024px) {
.grid {
grid-template-columns: repeat(2, 1fr); /* 2 columns for tablets */
}
}
@media (max-width: 600px) {
.grid {
grid-template-columns: 1fr; /* 1 column for mobile */
}
}
</style>
</head>
<body>
<h2>Responsive Product Grid</h2>
<div class="grid">
<div class="card">
<img src="https://castlecrown.co.in/cdn/shop/files/New_Blue_Plain_Svg.svg?v=1746163934&width=720" alt="Product 1">
<h3>Product 1</h3>
<p>Cotton Shirts at lowest price.</p>
<p class="price">₹1,500/-</p>
</div>
<div class="card">
<img src="https://media.istockphoto.com/id/500455404/photo/single-electric-food-processor-in-retail-store.jpg?s=612x612&w=0&k=20&c=tdZ79YLvfm4ek_s4sKS_fit28PFauRXwXRJD3kylfSQ=" alt="Product 2">
<h3>Product 2</h3>
<p>High Quality and Strong Item.</p>
<p class="price">₹5,000/-</p>
</div>
<div class="card">
<img src="https://m.media-amazon.com/images/I/510uTHyDqGL._SX679_.jpg" alt="Product 3">
<h3>Product 3</h3>
<p>Fast, Stylish, and Efficient with premium feature.</p>
<p class="price">₹95,000/-</p>
</div>
<div class="card">
<img src="https://5.imimg.com/data5/SELLER/Default/2024/9/448252354/BL/EM/ZV/11239587/men-winter-lower.jpg" alt="Product 4">
<h3>Product 4</h3>
<p>Trendy design with premium quality.</p>
<p class="price">₹4,000/-</p>
</div>
</div>
</body>
</html>
