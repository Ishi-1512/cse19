<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Hotel Room Booking Form</h1>
    <form action="#" method="Post"aling="center">
    <lable for="fullname">Fullname:</lable>
    <input type="text" id="fullname" name="fullname" required>
    <br><br>
    
    <!--Email-->
    <lable for="email">Email:</lable>
    <input type="email" id="email" name="Email" required>
    <br><br>
    <!--Phone-->
    <lable for="Phone"> Phone:</lable>
    <input type="tel" id="phone" name="Phone" required>
    <br><br>
    <!--Check in -->
    <lable for="check in">Check in date</lable>
    <input type="date" id="check in " name="check in" required>
    <br><br>
    <!--Check out-->
    <lable for="check out"> Check out date</lable>
    <input type="date" id="check out" name="check out" required>
    <br><br>
    <!--Room-->
    <lable for="room">Room Type</lable>
    <select id="room" name="Room">
    <option value="single">Single Room</option>
    <option value="Double">Double Room</option>
    <option value="deluxe">Deluxe Room</option>
    <option value="Suit">Suit Room</option>
    </select>
    <br><br>
    <!--Guest-->
    <lable for="request">Special Guest</lable>
    <textarea id="request" name="request" row="4" cols="40"></textarea>
    <br><br>
    <input type="submit" value="Book Now">
    <input type="submit" value="Reset Form">
</form>
