<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="Center">Student Registration Form</h1>
    <section>
        <hr>
        <!-- Registration Form --> <form method="post" action="submit.html">
    </section>
    <!--Name-->
    <lable for="fullname">Full Name:</lable>
    <input type="text" id="fullname" name="fullname" required>
    <br></br>
    <!--Emmail-->
    <lable for="email">Email:</lable>
    <input type="email" id="email" name="email" required>
    <br></br>
    <!--Password-->
    <lable for="password">Password:</lable>
    <input type="password" id="password" name="password" required>
    <br></br>
    <!--Gender-->
    <lable>Gender:</lable>
    <input type="radio" name="gender" value="male" required> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other">Other
    <br></br>
    <!--Course selection-->
    <lable>Course:</lable>
    <select name="course" required>
        <option value="">--Select Course--</option>
        <option value="btech">B.Tech</option>
        <option value="bca">BCA</option>
        <option value="mba">MBA</option>
        <option value="mca">MCA</option>
    </select>
    <br></br>
    <!--Contact no.-->
    <lable for="Contact no.">Contact No:</lable>
    <input type="tel" name="contact" placeholder="Enter phone number" required>
    <br></br>
    <!--Address-->
    <lable>Address:</lable>
    <br></br>
    <textarea name="address" row="4" cols="40" placeholder="Enter your address" required></textarea>
    <br></br>
    <!--Submit and reset-->
    <input type="Submit" value="Register">
    <input type="reset"  value="Clear">
</form>

</section>

</body>
</html>
